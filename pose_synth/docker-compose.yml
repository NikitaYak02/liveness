# Build only. Runtime uses envs/docker_run.sh -> `docker run --gpus all`
# so we do not depend on compose translating a `gpus:` key (breaks on some setups).
#
#   docker compose build
#   bash envs/docker_run.sh bash envs/install_all.sh
#   bash envs/docker_run.sh python run_pose_synth.py -i /data/frames -o /out/r1 --gpus 0,1

services:
  pose_synth:
    build: .
    image: pose_synth:cu124
    working_dir: /workspace/pose_synth
